# /etc/nginx/sites-available/desfile  →  ln -s em sites-enabled, depois: certbot --nginx -d desfile.seudominio.com.br

# Micro-cache da página pública: segura centenas de celulares consultando ao mesmo tempo.
proxy_cache_path /var/cache/nginx/desfile levels=1:2 keys_zone=desfile_publico:1m max_size=10m inactive=1m;

server {
    listen 80;
    server_name desfile.seudominio.com.br;

    location /api/publico/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_cache desfile_publico;
        proxy_cache_valid 200 404 2s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        add_header X-Cache $upstream_cache_status;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
